<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d">
  <title id="t">Rolling, blue-green and canary deployments as three timelines of traffic and versions</title>
  <desc id="d">Three horizontal timelines. Rolling: pods are replaced in batches so the share of traffic on the new version climbs in steps while capacity stays constant. Blue-green: the full green fleet starts idle, traffic switches all at once at the load balancer, blue stays running for a fast rollback, then is removed. Canary: a small slice of traffic goes to the new version, metrics are compared with the baseline at each step, and the rollout promotes or aborts.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .h { font-size: 26px; font-weight: 700; fill: #F2F4EC; }
    .sub { font-size: 15px; fill: #8A9185; }
    .lab { font-size: 16px; font-weight: 600; fill: #F2F4EC; }
    .note { font-size: 14px; fill: #B7BDB1; }
    .key { font-size: 14px; font-weight: 600; fill: #C6F432; }
    .small { font-size: 13px; fill: #8A9185; }
    .band { fill: #121612; stroke: #2A312A; stroke-width: 1; }
    .old { fill: #2A312A; stroke: #8A9185; stroke-width: 1; }
    .new { fill: #C6F432; stroke: #C6F432; stroke-width: 1; }
    .idle { fill: none; stroke: #C6F432; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .axis { stroke: #4A5348; stroke-width: 1.5; }
    .gate { stroke: #F2C14B; stroke-width: 2; stroke-dasharray: 3 3; }
    .abort { stroke: #FF8A80; stroke-width: 2; }
  </style>
  <rect x="0" y="0" width="1200" height="760" rx="16" fill="#0B0E0B" stroke="#1E231D"/>
  <text class="h" x="40" y="52">Rolling, blue-green, canary: who gets traffic, and when</text>
  <text class="sub" x="40" y="78">Each bar is the share of user traffic on the old version (grey) and the new version (lime) over time. Idle fleets are noted in text.</text>

  <!-- legend -->
  <rect class="old" x="900" y="94" width="22" height="14"/>
  <text class="small" x="928" y="106">old version v1</text>
  <rect class="new" x="1032" y="94" width="22" height="14"/>
  <text class="small" x="1060" y="106">new version v2</text>

  <!-- ROLLING -->
  <rect class="band" x="40" y="120" width="1120" height="190" rx="10"/>
  <text class="lab" x="56" y="146">Rolling update</text>
  <text class="small" x="200" y="146">maxSurge 1, maxUnavailable 0, 4 pods: capacity never drops, both versions serve at once for minutes</text>
  <!-- time axis -->
  <line class="axis" x1="150" y1="280" x2="1100" y2="280"/>
  <text class="small" x="150" y="298">t0 apply</text>
  <text class="small" x="340" y="298">pod 1 ready</text>
  <text class="small" x="530" y="298">pod 2 ready</text>
  <text class="small" x="720" y="298">pod 3 ready</text>
  <text class="small" x="910" y="298">pod 4 ready</text>
  <text class="small" x="1030" y="298">done, ~4 min</text>
  <!-- stacked bar: y 170..270 = 100 % ; new on bottom -->
  <rect class="old" x="150" y="170" width="190" height="100"/>
  <rect class="old" x="340" y="170" width="190" height="75"/>
  <rect class="new" x="340" y="245" width="190" height="25"/>
  <rect class="old" x="530" y="170" width="190" height="50"/>
  <rect class="new" x="530" y="220" width="190" height="50"/>
  <rect class="old" x="720" y="170" width="190" height="25"/>
  <rect class="new" x="720" y="195" width="190" height="75"/>
  <rect class="new" x="910" y="170" width="190" height="100"/>
  <text class="small" x="60" y="175">100%</text>
  <text class="small" x="60" y="274">0%</text>
  <text class="note" x="245" y="225" text-anchor="middle">v1 only</text>
  <text class="note" x="435" y="212" text-anchor="middle">25% on v2</text>
  <text class="note" x="625" y="200" text-anchor="middle">50%</text>
  <text class="note" x="815" y="188" text-anchor="middle">75%</text>
  <text class="note" x="1005" y="225" text-anchor="middle" style="fill:#0B0E0B">v2 only</text>

  <!-- BLUE GREEN -->
  <rect class="band" x="40" y="326" width="1120" height="190" rx="10"/>
  <text class="lab" x="56" y="352">Blue-green</text>
  <text class="small" x="170" y="352">two full fleets, two ALB target groups; the listener switch moves 100% of traffic in one step; rollback is the same switch back</text>
  <line class="axis" x1="150" y1="486" x2="1100" y2="486"/>
  <text class="small" x="150" y="504">t0 green deploys</text>
  <text class="small" x="440" y="504">smoke test green</text>
  <text class="small" x="680" y="504">listener switch</text>
  <text class="small" x="900" y="504">watch 30 min</text>
  <text class="small" x="1040" y="504">blue removed</text>
  <rect class="old" x="150" y="376" width="530" height="100"/>
  <rect class="new" x="680" y="376" width="420" height="100"/>
  <line class="gate" x1="680" y1="366" x2="680" y2="486"/>
  <text class="small" x="60" y="381">100%</text>
  <text class="small" x="60" y="480">0%</text>
  <text class="note" x="415" y="420" text-anchor="middle">blue (v1) serves 100%</text>
  <text class="small" x="415" y="444" text-anchor="middle">green (v2) running idle, costs double for this window</text>
  <text class="note" x="890" y="420" text-anchor="middle" style="fill:#0B0E0B">green (v2) serves 100%</text>
  <text class="small" x="890" y="444" text-anchor="middle" style="fill:#0B0E0B">blue kept idle: rollback in seconds</text>

  <!-- CANARY -->
  <rect class="band" x="40" y="532" width="1120" height="190" rx="10"/>
  <text class="lab" x="56" y="558">Canary</text>
  <text class="small" x="140" y="558">weighted target groups or Argo Rollouts; each step compares canary error rate and p99 against the baseline, then promotes or aborts</text>
  <line class="axis" x1="150" y1="692" x2="1100" y2="692"/>
  <text class="small" x="150" y="710">5% for 10 min</text>
  <text class="small" x="340" y="710">25% for 10 min</text>
  <text class="small" x="530" y="710">50% for 10 min</text>
  <text class="small" x="720" y="710">100%</text>
  <text class="small" x="880" y="710">abort path: weight back to 0 in seconds</text>
  <rect class="old" x="150" y="582" width="190" height="95"/>
  <rect class="new" x="150" y="677" width="190" height="5"/>
  <rect class="old" x="340" y="582" width="190" height="75"/>
  <rect class="new" x="340" y="657" width="190" height="25"/>
  <rect class="old" x="530" y="582" width="190" height="50"/>
  <rect class="new" x="530" y="632" width="190" height="50"/>
  <rect class="new" x="720" y="582" width="140" height="100"/>
  <line class="gate" x1="340" y1="572" x2="340" y2="692"/>
  <line class="gate" x1="530" y1="572" x2="530" y2="692"/>
  <line class="gate" x1="720" y1="572" x2="720" y2="692"/>
  <text class="key" x="348" y="577">analysis</text>
  <text class="key" x="538" y="577">analysis</text>
  <text class="key" x="728" y="577">analysis</text>
  <!-- abort example -->
  <rect class="old" x="880" y="582" width="220" height="100"/>
  <line class="abort" x1="880" y1="677" x2="1100" y2="677"/>
  <text class="note" x="990" y="625" text-anchor="middle">error rate 3.5% vs 1.0%</text>
  <text class="note" x="990" y="647" text-anchor="middle" style="fill:#FF8A80">abort: v1 serves 100% again</text>
  <text class="small" x="60" y="587">100%</text>
  <text class="small" x="60" y="686">0%</text>
  <text class="note" x="245" y="630" text-anchor="middle">v1 95%</text>
  <text class="note" x="435" y="622" text-anchor="middle">v1 75%</text>
  <text class="note" x="625" y="610" text-anchor="middle">v1 50%</text>
  <text class="note" x="790" y="636" text-anchor="middle" style="fill:#0B0E0B">v2 100%</text>

  <text class="small" x="40" y="746">Rolling is the Kubernetes default and cheapest. Blue-green buys instant rollback with double capacity. Canary limits the blast radius and lets metrics decide.</text>
</svg>
