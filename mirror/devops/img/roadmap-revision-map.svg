<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 784" width="1200" height="784" role="img" aria-labelledby="t d">
  <title id="t">The DevOps roadmap as a map of the stack, with every revision term placed in its module</title>
  <desc id="d">Six horizontal bands, one per roadmap module: Foundations, Build and ship, Cloud and IaC, Kubernetes, Operate, Contribute. Each band lists the revision-sheet terms that belong to it as small chips. The Kubernetes band is highlighted because it holds the most terms and decides most interviews.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .h { font-size: 26px; font-weight: 700; fill: #F2F4EC; }
    .sub { font-size: 15px; fill: #8A9185; }
    .lab { font-size: 17px; font-weight: 700; }
    .small { font-size: 13px; fill: #8A9185; }
    .note { font-size: 14px; fill: #B7BDB1; }
    .chip { fill: #0B0E0B; stroke: #8A9185; stroke-width: 1.2; }
    .chiphot { fill: #0B0E0B; stroke: #C6F432; stroke-width: 1.6; }
    .chipx { fill: #121612; stroke: #4A5348; stroke-width: 1; stroke-dasharray: 4 3; }
    .ct { font-size: 14px; fill: #F2F4EC; }
    .cthot { font-size: 14px; fill: #C6F432; font-weight: 600; }
    .ctx { font-size: 14px; fill: #B7BDB1; }
  </style>
  <rect x="0" y="0" width="1200" height="784" rx="16" fill="#0B0E0B" stroke="#1E231D"/>
  <text class="h" x="40" y="52">The roadmap as a map: where each revision term lives</text>
  <text class="sub" x="40" y="78">Solid chips: the 42 revision-sheet terms plus 3 operator terms from lessons 25 and 26. Dashed: extra ideas asked in the same round.</text>
  <text class="sub" x="40" y="98">Lime marks the Kubernetes band: most scenario questions start there.</text>
