<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d">
  <title id="t">A CI/CD pipeline from push to production, with the gates that stop a bad change</title>
  <desc id="d">Row one is continuous integration on every pull request: lint, unit tests, build and image, scan, integration tests. A merge gate requires all checks to pass. Row two is delivery on the main branch: push the image by digest, deploy to staging, smoke test, a required reviewer approves, then a canary to production. The same image digest moves through every stage.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .h { font-size: 26px; font-weight: 700; fill: #F2F4EC; }
    .sub { font-size: 15px; fill: #8A9185; }
    .lab { font-size: 16px; font-weight: 600; fill: #F2F4EC; }
    .note { font-size: 14px; fill: #B7BDB1; }
    .key { font-size: 15px; font-weight: 600; fill: #C6F432; }
    .small { font-size: 13px; fill: #8A9185; }
    .band { fill: #121612; stroke: #2A312A; stroke-width: 1; }
    .box { fill: #0B0E0B; stroke: #8A9185; stroke-width: 1.5; }
    .gate { fill: #0B0E0B; stroke: #C6F432; stroke-width: 2; }
    .fail { fill: #0B0E0B; stroke: #FF8A80; stroke-width: 1.5; }
    .edge { stroke: #4A5348; stroke-width: 1.8; fill: none; }
    .flow { stroke: #C6F432; stroke-width: 2.2; fill: none; }
    .digest { stroke: #7CC4F8; stroke-width: 1.8; fill: none; stroke-dasharray: 5 5; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8A9185"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#C6F432"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="620" rx="16" fill="#0B0E0B" stroke="#1E231D"/>
  <text class="h" x="40" y="52">From push to production: stages and gates</text>
  <text class="sub" x="40" y="78">Build the image once, then promote the same digest. Every gate can stop the change; nothing after a gate rebuilds it.</text>

  <!-- CI band -->
  <rect class="band" x="40" y="100" width="1120" height="170" rx="10"/>
  <text class="lab" x="56" y="126">1. Continuous integration: runs on every pull request, about 10 minutes with caching</text>

  <rect class="box" x="60" y="146" width="196" height="100" rx="8"/>
  <text class="lab" x="158" y="176" text-anchor="middle">Lint and format</text>
  <text class="note" x="158" y="198" text-anchor="middle">ruff, go vet, hadolint</text>
  <text class="small" x="158" y="220" text-anchor="middle">about 1 min</text>

  <rect class="box" x="286" y="146" width="196" height="100" rx="8"/>
  <text class="lab" x="384" y="176" text-anchor="middle">Unit tests</text>
  <text class="note" x="384" y="198" text-anchor="middle">matrix: 3.12 and 3.13</text>
  <text class="small" x="384" y="220" text-anchor="middle">about 3 min, cached deps</text>

  <rect class="box" x="512" y="146" width="196" height="100" rx="8"/>
  <text class="lab" x="610" y="176" text-anchor="middle">Build image</text>
  <text class="note" x="610" y="198" text-anchor="middle">buildx, layer cache</text>
  <text class="small" x="610" y="220" text-anchor="middle">output: sha256 digest</text>

  <rect class="box" x="738" y="146" width="196" height="100" rx="8"/>
  <text class="lab" x="836" y="176" text-anchor="middle">Scan image</text>
  <text class="note" x="836" y="198" text-anchor="middle">trivy, fail on CRITICAL</text>
  <text class="small" x="836" y="220" text-anchor="middle">about 1 min</text>

  <rect class="box" x="964" y="146" width="180" height="100" rx="8"/>
  <text class="lab" x="1054" y="176" text-anchor="middle">Integration</text>
  <text class="note" x="1054" y="198" text-anchor="middle">postgres service</text>
  <text class="small" x="1054" y="220" text-anchor="middle">about 5 min</text>

  <path class="edge" d="M256 196L278 196" marker-end="url(#a)"/>
  <path class="edge" d="M482 196L504 196" marker-end="url(#a)"/>
  <path class="edge" d="M708 196L730 196" marker-end="url(#a)"/>
  <path class="edge" d="M934 196L956 196" marker-end="url(#a)"/>

  <!-- merge gate -->
  <rect class="gate" x="380" y="292" width="440" height="52" rx="8"/>
  <text class="key" x="600" y="314" text-anchor="middle">Gate 1: branch protection</text>
  <text class="note" x="600" y="334" text-anchor="middle">all required checks green, 1 review, then merge to main</text>
  <path class="flow" d="M1054 246L1054 318L828 318" marker-end="url(#g)"/>
  <path class="flow" d="M600 344L600 372" marker-end="url(#g)"/>

  <!-- CD band -->
  <rect class="band" x="40" y="372" width="1120" height="170" rx="10"/>
  <text class="lab" x="56" y="398">2. Delivery: runs on main only, one run at a time per environment</text>

  <rect class="box" x="60" y="418" width="196" height="100" rx="8"/>
  <text class="lab" x="158" y="448" text-anchor="middle">Push by digest</text>
  <text class="note" x="158" y="470" text-anchor="middle">ECR, tag = git sha</text>
  <text class="small" x="158" y="492" text-anchor="middle">OIDC role, no keys</text>

  <rect class="box" x="286" y="418" width="196" height="100" rx="8"/>
  <text class="lab" x="384" y="448" text-anchor="middle">Deploy staging</text>
  <text class="note" x="384" y="470" text-anchor="middle">helm upgrade @digest</text>
  <text class="small" x="384" y="492" text-anchor="middle">environment: staging</text>

  <rect class="box" x="512" y="418" width="196" height="100" rx="8"/>
  <text class="lab" x="610" y="448" text-anchor="middle">Smoke test</text>
  <text class="note" x="610" y="470" text-anchor="middle">GET /healthz, 1 login</text>
  <text class="small" x="610" y="492" text-anchor="middle">fails: stop here</text>

  <rect class="gate" x="738" y="418" width="196" height="100" rx="8"/>
  <text class="key" x="836" y="448" text-anchor="middle">Gate 2: reviewer</text>
  <text class="note" x="836" y="470" text-anchor="middle">environment: production</text>
  <text class="small" x="836" y="492" text-anchor="middle">required reviewers, 6 max</text>

  <rect class="box" x="964" y="418" width="180" height="100" rx="8"/>
  <text class="lab" x="1054" y="448" text-anchor="middle">Canary to prod</text>
  <text class="note" x="1054" y="470" text-anchor="middle">5, 25, 50, 100 percent</text>
  <text class="small" x="1054" y="492" text-anchor="middle">auto abort on errors</text>

  <path class="edge" d="M256 468L278 468" marker-end="url(#a)"/>
  <path class="edge" d="M482 468L504 468" marker-end="url(#a)"/>
  <path class="edge" d="M708 468L730 468" marker-end="url(#a)"/>
  <path class="flow" d="M934 468L956 468" marker-end="url(#g)"/>

  <!-- digest line -->
  <path class="digest" d="M158 518L158 560L1054 560L1054 518"/>
  <text class="small" x="600" y="580" text-anchor="middle">dashed blue: the same image digest, built once in stage 1, is what staging and production run. Tags move; digests do not.</text>
  <text class="small" x="40" y="606">Lime boxes are gates: a human or a rule can stop the change there. Everything else is automatic and must be fast enough to run on every push.</text>
</svg>
