<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 684" width="1200" height="684" role="img" aria-labelledby="t d">
  <title id="t">Kubernetes architecture: control plane components and worker nodes</title>
  <desc id="d">The control plane holds the API server, etcd, scheduler and controller manager. Every worker node runs kubelet, kube-proxy and a container runtime, and hosts pods. All traffic to the cluster state goes through the API server.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .h { font-size: 26px; font-weight: 700; fill: #F2F4EC; }
    .sub { font-size: 15px; fill: #8A9185; }
    .lab { font-size: 16px; font-weight: 600; fill: #F2F4EC; }
    .note { font-size: 14px; fill: #B7BDB1; }
    .key { font-size: 14px; font-weight: 600; fill: #C6F432; }
    .small { font-size: 13px; fill: #8A9185; }
    .band { fill: #121612; stroke: #2A312A; stroke-width: 1; }
    .box { fill: #0B0E0B; stroke: #8A9185; stroke-width: 1.5; }
    .hot { fill: #0B0E0B; stroke: #C6F432; stroke-width: 2; }
    .pod { fill: #121612; stroke: #7CC4F8; stroke-width: 1.5; }
    .edge { stroke: #4A5348; stroke-width: 1.5; fill: none; }
    .flow { stroke: #C6F432; stroke-width: 2.2; fill: none; }
    .watch { stroke: #7CC4F8; stroke-width: 1.8; fill: none; stroke-dasharray: 5 5; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#C6F432"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7CC4F8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="684" rx="16" fill="#0B0E0B" stroke="#1E231D"/>
  <text class="h" x="40" y="52">Kubernetes: one API server, many control loops</text>
  <text class="sub" x="40" y="78">Nothing talks to etcd directly. Every component reads and writes cluster state through the API server.</text>

  <!-- control plane band -->
  <rect class="band" x="40" y="104" width="1120" height="216" rx="10"/>
  <text class="lab" x="56" y="130">Control plane</text>
  <text class="small" x="176" y="130">usually 3 nodes; on EKS it is managed by AWS and you never see these machines</text>

  <!-- API server -->
  <rect class="hot" x="470" y="150" width="260" height="64" rx="8"/>
  <text class="key" x="600" y="176" text-anchor="middle">kube-apiserver</text>
  <text class="note" x="600" y="198" text-anchor="middle">REST API, auth, admission, validation</text>

  <!-- etcd -->
  <rect class="box" x="790" y="150" width="250" height="64" rx="8"/>
  <text class="lab" x="915" y="176" text-anchor="middle">etcd</text>
  <text class="note" x="915" y="198" text-anchor="middle">key-value store, Raft, the truth</text>
  <path class="flow" d="M730 182L782 182" marker-end="url(#a)"/>

  <!-- scheduler -->
  <rect class="box" x="60" y="250" width="260" height="64" rx="8"/>
  <text class="lab" x="190" y="276" text-anchor="middle">kube-scheduler</text>
  <text class="note" x="190" y="298" text-anchor="middle">places each new pod on a node</text>

  <!-- controller manager -->
  <rect class="box" x="340" y="250" width="300" height="64" rx="8"/>
  <text class="lab" x="490" y="276" text-anchor="middle">kube-controller-manager</text>
  <text class="note" x="490" y="298" text-anchor="middle">Deployment, ReplicaSet, Node, Job loops</text>

  <!-- cloud controller -->
  <rect class="box" x="660" y="250" width="300" height="64" rx="8"/>
  <text class="lab" x="810" y="276" text-anchor="middle">cloud-controller-manager</text>
  <text class="note" x="810" y="298" text-anchor="middle">load balancers, node lifecycle, routes</text>

  <!-- watches to API server -->
  <path class="watch" d="M190 250L190 224L460 224L460 182" marker-end="url(#b)"/>
  <path class="watch" d="M560 250L560 214" marker-end="url(#b)"/>
  <path class="watch" d="M810 250L810 224L740 224L740 196" marker-end="url(#b)"/>

  <!-- worker nodes -->
  <rect class="band" x="40" y="344" width="548" height="272" rx="10"/>
  <rect class="band" x="612" y="344" width="548" height="272" rx="10"/>
  <text class="lab" x="56" y="370">Worker node 1</text>
  <text class="lab" x="628" y="370">Worker node 2</text>
  <text class="small" x="190" y="370">EC2 instance in a node group, or Fargate</text>
  <text class="small" x="762" y="370">kubelet registers the node with the API server</text>

  <!-- node 1 components -->
  <rect class="box" x="60" y="388" width="160" height="56" rx="8"/>
  <text class="lab" x="140" y="411" text-anchor="middle">kubelet</text>
  <text class="small" x="140" y="430" text-anchor="middle">runs pods, reports status</text>
  <rect class="box" x="236" y="388" width="160" height="56" rx="8"/>
  <text class="lab" x="316" y="411" text-anchor="middle">kube-proxy</text>
  <text class="small" x="316" y="430" text-anchor="middle">Service iptables rules</text>
  <rect class="box" x="412" y="388" width="160" height="56" rx="8"/>
  <text class="lab" x="492" y="411" text-anchor="middle">containerd</text>
  <text class="small" x="492" y="430" text-anchor="middle">runs containers (CRI)</text>

  <rect class="pod" x="60" y="470" width="236" height="120" rx="8"/>
  <text class="lab" x="178" y="496" text-anchor="middle">Pod: api-7d9f</text>
  <rect class="box" x="76" y="512" width="96" height="60" rx="6"/>
  <text class="small" x="124" y="538" text-anchor="middle">container</text>
  <text class="small" x="124" y="556" text-anchor="middle">api:1.4.2</text>
  <rect class="box" x="184" y="512" width="96" height="60" rx="6"/>
  <text class="small" x="232" y="538" text-anchor="middle">sidecar</text>
  <text class="small" x="232" y="556" text-anchor="middle">otel-agent</text>
  <rect class="pod" x="316" y="470" width="236" height="120" rx="8"/>
  <text class="lab" x="434" y="496" text-anchor="middle">Pod: worker-c21b</text>
  <rect class="box" x="332" y="512" width="204" height="60" rx="6"/>
  <text class="small" x="434" y="538" text-anchor="middle">one container, one pod IP,</text>
  <text class="small" x="434" y="556" text-anchor="middle">shared network and volumes</text>

  <!-- node 2 components -->
  <rect class="box" x="632" y="388" width="160" height="56" rx="8"/>
  <text class="lab" x="712" y="411" text-anchor="middle">kubelet</text>
  <text class="small" x="712" y="430" text-anchor="middle">runs pods, reports status</text>
  <rect class="box" x="808" y="388" width="160" height="56" rx="8"/>
  <text class="lab" x="888" y="411" text-anchor="middle">kube-proxy</text>
  <text class="small" x="888" y="430" text-anchor="middle">Service iptables rules</text>
  <rect class="box" x="984" y="388" width="160" height="56" rx="8"/>
  <text class="lab" x="1064" y="411" text-anchor="middle">containerd</text>
  <text class="small" x="1064" y="430" text-anchor="middle">runs containers (CRI)</text>

  <rect class="pod" x="632" y="470" width="236" height="120" rx="8"/>
  <text class="lab" x="750" y="496" text-anchor="middle">Pod: api-2a11</text>
  <rect class="box" x="648" y="512" width="204" height="60" rx="6"/>
  <text class="small" x="750" y="538" text-anchor="middle">replica 2 of the same</text>
  <text class="small" x="750" y="556" text-anchor="middle">Deployment, scheduled here</text>
  <rect class="pod" x="888" y="470" width="256" height="120" rx="8"/>
  <text class="lab" x="1016" y="496" text-anchor="middle">Pod: coredns-5f (kube-system)</text>
  <rect class="box" x="904" y="512" width="224" height="60" rx="6"/>
  <text class="small" x="1016" y="538" text-anchor="middle">cluster DNS: resolves</text>
  <text class="small" x="1016" y="556" text-anchor="middle">api.default.svc.cluster.local</text>

  <!-- kubelet watches -->
  <path class="watch" d="M140 388L140 332L330 332L330 238L480 238L480 214" marker-end="url(#b)"/>
  <path class="watch" d="M712 388L712 332L650 332L650 214" marker-end="url(#b)"/>
  <text class="small" x="880" y="336">kubelets watch for pods assigned to their node</text>

  <!-- footer -->
  <text class="note" x="40" y="642">kubectl apply writes the desired state to the API server; controllers and kubelets move the real state toward it. That loop is the whole design.</text>
  <text class="small" x="40" y="666">Legend: dashed blue = watch and update through the API server; solid lime = request path</text>
</svg>
