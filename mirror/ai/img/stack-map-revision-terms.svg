  <rect class="chip" x="368" y="342" width="208" height="30" rx="15"/>
  <text class="term" x="472" y="362" text-anchor="middle">Catastrophic forgetting</text>
  <text class="yr" x="272" y="396">2026 trends:</text>
  <text class="note" x="364" y="396">context engineering, small fine-tuned model plus RAG, RLVR and GRPO</text>
  <rect class="band" x="40" y="424" width="1120" height="88" rx="10"/>
  <text class="lab" x="92" y="465">Serve</text>
  <text class="mut" x="92" y="487">Lesson 11, 6 terms</text>
  <rect class="chip" x="272" y="442" width="89" height="30" rx="15"/>
  <text class="term" x="316.5" y="462" text-anchor="middle">KV cache</text>
  <rect class="chip" x="369" y="442" width="58" height="30" rx="15"/>
  <text class="term" x="398" y="462" text-anchor="middle">TTFT</text>
  <rect class="chip" x="435" y="442" width="176" height="30" rx="15"/>
  <text class="term" x="523" y="462" text-anchor="middle">Continuous batching</text>
  <rect class="chip" x="619" y="442" width="137" height="30" rx="15"/>
  <text class="term" x="687.5" y="462" text-anchor="middle">PagedAttention</text>
  <rect class="chip" x="764" y="442" width="121" height="30" rx="15"/>
  <text class="term" x="824.5" y="462" text-anchor="middle">Quantization</text>
  <rect class="chip" x="893" y="442" width="184" height="30" rx="15"/>
  <text class="term" x="985" y="462" text-anchor="middle">Speculative decoding</text>
  <text class="yr" x="272" y="496">2026 trends:</text>
  <text class="note" x="364" y="496">TGI in maintenance mode, vLLM and SGLang active, prefix caching for agent traffic</text>
  <rect class="band" x="40" y="524" width="1120" height="88" rx="10"/>
  <text class="lab" x="92" y="565">Agents</text>
  <text class="mut" x="92" y="587">Lessons 12 to 15, 4 terms</text>
  <rect class="chip" x="272" y="542" width="66" height="30" rx="15"/>
  <text class="term" x="305" y="562" text-anchor="middle">Agent</text>
  <rect class="chip" x="346" y="542" width="121" height="30" rx="15"/>
  <text class="term" x="406.5" y="562" text-anchor="middle">Tool calling</text>
  <rect class="chip" x="475" y="542" width="50" height="30" rx="15"/>
  <text class="term" x="500" y="562" text-anchor="middle">MCP</text>
  <rect class="chip" x="533" y="542" width="50" height="30" rx="15"/>
  <text class="term" x="558" y="562" text-anchor="middle">A2A</text>
  <text class="yr" x="272" y="596">2026 trends:</text>
  <text class="note" x="364" y="596">MCP and A2A, long-running agents, coding agents, framework consolidation</text>
  <rect class="band" x="40" y="624" width="1120" height="88" rx="10"/>
  <text class="lab" x="92" y="665">Ship</text>
  <text class="mut" x="92" y="687">Lessons 16 to 18, 3 terms</text>
  <rect class="chip" x="272" y="642" width="152" height="30" rx="15"/>
  <text class="term" x="348" y="662" text-anchor="middle">Prompt injection</text>
  <rect class="chip" x="432" y="642" width="121" height="30" rx="15"/>
  <text class="term" x="492.5" y="662" text-anchor="middle">LLM-as-judge</text>
  <rect class="chip" x="561" y="642" width="105" height="30" rx="15"/>
  <text class="term" x="613.5" y="662" text-anchor="middle">Guardrails</text>
  <text class="yr" x="272" y="696">2026 trends:</text>
  <text class="note" x="364" y="696">reliability and security are the open problems for long-running agents</text>
  <path class="rail" d="M68 140V660"/>
  <circle class="dot" cx="68" cy="140" r="13"/>
