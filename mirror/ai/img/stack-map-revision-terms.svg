  <rect class="chip" x="368" y="302" width="58" height="30" rx="15"/>
  <text class="term" x="397" y="322" text-anchor="middle">PEFT</text>
  <rect class="chip" x="434" y="302" width="58" height="30" rx="15"/>
  <text class="term" x="463" y="322" text-anchor="middle">LoRA</text>
  <rect class="chip" x="500" y="302" width="73" height="30" rx="15"/>
  <text class="term" x="536.5" y="322" text-anchor="middle">Rank r</text>
  <rect class="chip" x="581" y="302" width="66" height="30" rx="15"/>
  <text class="term" x="614" y="322" text-anchor="middle">QLoRA</text>
  <rect class="chip" x="655" y="302" width="58" height="30" rx="15"/>
  <text class="term" x="684" y="322" text-anchor="middle">DoRA</text>
  <rect class="chip" x="721" y="302" width="50" height="30" rx="15"/>
  <text class="term" x="746" y="322" text-anchor="middle">DPO</text>
  <rect class="chip" x="779" y="302" width="129" height="30" rx="15"/>
  <text class="term" x="843.5" y="322" text-anchor="middle">GRPO and RLVR</text>
  <rect class="chip" x="916" y="302" width="121" height="30" rx="15"/>
