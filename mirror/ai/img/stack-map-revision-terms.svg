<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-labelledby="t d">
  <title id="t">The roadmap as a map of the stack: where each of the 37 revision terms belongs</title>
  <desc id="d">Five stacked layers in study order: Foundations, Build with LLMs, Serve, Agents and Ship. Each layer lists its revision-sheet terms as labelled chips, and one line naming the 2026 trends that touch that layer.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .h { font-size: 26px; font-weight: 700; fill: #F2F4EC; }
    .sub { font-size: 15px; fill: #8A9185; }
    .lab { font-size: 16px; font-weight: 700; fill: #F2F4EC; }
    .mut { font-size: 13px; fill: #8A9185; }
    .note { font-size: 14px; fill: #B7BDB1; }
    .term { font-size: 14px; font-weight: 500; fill: #F2F4EC; }
    .yr { font-size: 14px; font-weight: 600; fill: #F2C14B; }
    .num { font-size: 14px; font-weight: 700; fill: #0B0E0B; }
    .band { fill: #121612; stroke: #2A312A; stroke-width: 1; }
    .chip { fill: #0B0E0B; stroke: #4A5348; stroke-width: 1.2; }
    .rail { stroke: #C6F432; stroke-width: 2; stroke-dasharray: 4 6; fill: none; }
    .dot { fill: #C6F432; }
  </style>
  <rect x="0" y="0" width="1200" height="740" rx="16" fill="#0B0E0B" stroke="#1E231D"/>
  <text class="h" x="40" y="52">The stack as a map: where each revision term lives</text>
  <text class="sub" x="40" y="78">Study top to bottom. All 37 revision-sheet terms are placed in one of five layers. Amber lines name the 2026 trends per layer.</text>
  <rect class="band" x="40" y="104" width="1120" height="128" rx="10"/>
  <text class="lab" x="92" y="145">Foundations</text>
  <text class="mut" x="92" y="167">Lessons 1 to 6, 10 terms</text>
  <rect class="chip" x="272" y="122" width="66" height="30" rx="15"/>
  <text class="term" x="305" y="142" text-anchor="middle">Token</text>
  <rect class="chip" x="346" y="122" width="97" height="30" rx="15"/>
  <text class="term" x="394.5" y="142" text-anchor="middle">Embedding</text>
  <rect class="chip" x="451" y="122" width="137" height="30" rx="15"/>
  <text class="term" x="519.5" y="142" text-anchor="middle">Self-attention</text>
  <rect class="chip" x="596" y="122" width="113" height="30" rx="15"/>
  <text class="term" x="652.5" y="142" text-anchor="middle">Causal mask</text>
  <rect class="chip" x="717" y="122" width="58" height="30" rx="15"/>
  <text class="term" x="746" y="142" text-anchor="middle">RoPE</text>
  <rect class="chip" x="783" y="122" width="113" height="30" rx="15"/>
  <text class="term" x="839.5" y="142" text-anchor="middle">Temperature</text>
  <rect class="chip" x="904" y="122" width="66" height="30" rx="15"/>
  <text class="term" x="937" y="142" text-anchor="middle">Top-p</text>
  <rect class="chip" x="978" y="122" width="137" height="30" rx="15"/>
  <text class="term" x="1046.5" y="142" text-anchor="middle">Context window</text>
  <rect class="chip" x="272" y="162" width="129" height="30" rx="15"/>
  <text class="term" x="336.5" y="182" text-anchor="middle">Hallucination</text>
  <rect class="chip" x="409" y="162" width="50" height="30" rx="15"/>
  <text class="term" x="434" y="182" text-anchor="middle">MoE</text>
  <text class="yr" x="272" y="216">2026 trends:</text>
  <text class="note" x="364" y="216">reasoning effort set per task, native multimodal models, open-weight MoE models</text>
  <rect class="band" x="40" y="244" width="1120" height="168" rx="10"/>
  <text class="lab" x="92" y="285">Build with LLMs</text>
  <text class="mut" x="92" y="307">Lessons 7 to 10, 14 terms</text>
  <text class="mut" x="272" y="282">RAG</text>
  <rect class="chip" x="368" y="262" width="50" height="30" rx="15"/>
