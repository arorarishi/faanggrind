  <text class="qt" x="116" y="226" text-anchor="middle">Q</text>
  <rect class="q" x="141" y="206" width="30" height="30" rx="5"/>
  <text class="qt" x="156" y="226" text-anchor="middle">Q</text>
  <rect class="q" x="181" y="206" width="30" height="30" rx="5"/>
  <text class="qt" x="196" y="226" text-anchor="middle">Q</text>
