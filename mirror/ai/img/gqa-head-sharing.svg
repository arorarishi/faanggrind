  <text class="qt" x="316" y="226" text-anchor="middle">Q</text>
  <rect class="q" x="341" y="206" width="30" height="30" rx="5"/>
  <text class="qt" x="356" y="226" text-anchor="middle">Q</text>
  <text class="mut" x="60" y="374">key/value heads, cached: 8</text>
  <text class="note" x="60" y="418">numbers per token, per layer</text>
  <text class="key" x="60" y="446">2 × 8 × d_head</text>
  <text class="note" x="372" y="446" text-anchor="end">baseline</text>
  <rect class="panel" x="424" y="104" width="352" height="372" rx="10"/>
  <text class="lab" x="444" y="138">Grouped-query (GQA), 2 groups</text>
  <text class="note" x="444" y="162">4 query heads share each one</text>
  <text class="mut" x="444" y="194">query heads, not cached</text>
  <path class="ln" d="M460 236L520 318"/>
  <path class="ln" d="M500 236L520 318"/>
