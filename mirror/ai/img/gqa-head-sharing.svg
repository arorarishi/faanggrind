  <text class="qt" x="700" y="226" text-anchor="middle">Q</text>
  <rect class="q" x="725" y="206" width="30" height="30" rx="5"/>
  <text class="qt" x="740" y="226" text-anchor="middle">Q</text>
  <text class="mut" x="444" y="374">key/value heads, cached: 2</text>
  <text class="note" x="444" y="418">numbers per token, per layer</text>
  <text class="key" x="444" y="446">2 × 2 × d_head</text>
  <text class="note" x="756" y="446" text-anchor="end">4 times smaller</text>
  <rect class="panel" x="808" y="104" width="352" height="372" rx="10"/>
  <text class="lab" x="828" y="138">Multi-query (MQA)</text>
  <text class="note" x="828" y="162">all 8 query heads share one</text>
  <text class="mut" x="828" y="194">query heads, not cached</text>
