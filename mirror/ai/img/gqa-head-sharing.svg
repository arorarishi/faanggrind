<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
  <title id="t">Multi-head, grouped-query and multi-query attention: how many key/value heads are cached</title>
  <desc id="d">Three panels, each with 8 query heads. In multi-head attention every query head has its own key/value head, so 8 are cached. In grouped-query attention with 2 groups, 4 query heads share each key/value head, so 2 are cached. In multi-query attention all 8 query heads share one key/value head, so 1 is cached.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .h { font-size: 26px; font-weight: 700; fill: #F2F4EC; }
    .sub { font-size: 15px; fill: #8A9185; }
    .lab { font-size: 16px; font-weight: 600; fill: #F2F4EC; }
    .note { font-size: 14px; fill: #B7BDB1; }
    .mut { font-size: 14px; fill: #8A9185; }
    .key { font-size: 15px; font-weight: 600; fill: #C6F432; }
    .panel { fill: #121612; stroke: #2A312A; stroke-width: 1; }
    .q { fill: #0B0E0B; stroke: #B7BDB1; stroke-width: 1.5; }
    .qt { font-size: 13px; font-weight: 600; fill: #B7BDB1; }
    .kv { fill: #C6F432; stroke: #C6F432; }
    .kvt { font-size: 13px; font-weight: 700; fill: #0B0E0B; }
    .ln { stroke: #6B7468; stroke-width: 1.5; fill: none; }
  </style>
  <rect x="0" y="0" width="1200" height="640" rx="16" fill="#0B0E0B" stroke="#1E231D"/>
  <text class="h" x="40" y="52">Fewer key/value heads, smaller KV cache</text>
  <text class="sub" x="40" y="78">All three have 8 query heads. Only the key/value heads (lime) are stored in the cache.</text>
  <rect class="panel" x="40" y="104" width="352" height="372" rx="10"/>
  <text class="lab" x="60" y="138">Multi-head (MHA)</text>
  <text class="note" x="60" y="162">every query head has its own</text>
  <text class="mut" x="60" y="194">query heads, not cached</text>
