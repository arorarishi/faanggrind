  <text class="mut" x="828" y="374">key/value heads, cached: 1</text>
  <text class="note" x="828" y="418">numbers per token, per layer</text>
  <text class="key" x="828" y="446">2 × 1 × d_head</text>
  <text class="note" x="1140" y="446" text-anchor="end">8 times smaller</text>
  <rect class="panel" x="40" y="496" width="1120" height="104" rx="10"/>
  <text class="lab" x="60" y="530">What stays the same</text>
  <text class="note" x="60" y="556">Every query head still computes its own scores and weights, so the number of scores computed per step does not shrink.</text>
  <text class="note" x="60" y="580">The saving is memory: fewer keys and values to store, and fewer to load from memory at every decoding step.</text>
</svg>
