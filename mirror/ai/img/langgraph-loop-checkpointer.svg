<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
  <title id="t">The LangGraph agent loop, with a checkpointer saving the state after every step</title>
  <desc id="d">START leads to the model node. A conditional edge asks whether the reply has tool calls. No goes to END. Yes goes to the tools node, whose results join the state before the model runs again. Below the graph, a checkpointer holds one saved state per step for the thread user-42: 2 messages after step 1, 3 after step 2, 4 after step 3.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .h { font-size: 26px; font-weight: 700; fill: #F2F4EC; }
    .sub { font-size: 15px; fill: #8A9185; }
    .lab { font-size: 15px; font-weight: 600; fill: #F2F4EC; }
    .note { font-size: 14px; fill: #B7BDB1; }
    .small { font-size: 13px; fill: #B7BDB1; }
    .key { font-size: 14px; font-weight: 600; fill: #C6F432; }
    .band { fill: #121612; stroke: #2A312A; stroke-width: 1; }
    .box { fill: #0B0E0B; stroke: #8A9185; stroke-width: 1.5; }
    .cond { fill: #0B0E0B; stroke: #C6F432; stroke-width: 2.5; }
    .edge { stroke: #8A9185; stroke-width: 2; fill: none; }
    .path { stroke: #C6F432; stroke-width: 2.5; fill: none; }
    .save { stroke: #7CC4F8; stroke-width: 2; stroke-dasharray: 5 6; fill: none; }
    .card { fill: #0B0E0B; stroke: #7CC4F8; stroke-width: 1.5; }
    .m { text-anchor: middle; }
    .e { text-anchor: end; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#C6F432"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8A9185"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7CC4F8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="640" rx="16" fill="#0B0E0B" stroke="#1E231D"/>
  <text class="h" x="40" y="52">LangGraph agent: two nodes and one conditional edge</text>
  <text class="sub" x="40" y="78">The model decides whether to loop. The checkpointer saves the state after every step, keyed by thread_id.</text>

  <!-- graph panel -->
  <rect class="band" x="40" y="104" width="740" height="252" rx="10"/>
  <text class="lab" x="56" y="130">The graph</text>

  <!-- fixed edges -->
  <path class="edge" d="M160 196H204" marker-end="url(#g)"/>
  <path class="edge" d="M410 196H442" marker-end="url(#g)"/>
  <path class="edge" d="M412 310H305V234" marker-end="url(#g)"/>
  <!-- conditional edge: the two ways out of the decision -->
  <path class="path" d="M592 196H658" marker-end="url(#a)"/>
  <path class="path" d="M520 242V276" marker-end="url(#a)"/>

  <!-- nodes -->
  <rect class="box" x="64" y="176" width="96" height="40" rx="20"/>
  <text class="lab m" x="112" y="201">START</text>

  <rect class="box" x="210" y="164" width="200" height="64" rx="8"/>
  <text class="lab m" x="310" y="191">Model node</text>
  <text class="small m" x="310" y="212">LLM reads all messages</text>

  <path class="cond" d="M448 196L520 150L592 196L520 242z"/>
  <text class="lab m" x="520" y="201">Tool calls?</text>

  <rect class="box" x="664" y="176" width="92" height="40" rx="20"/>
  <text class="lab m" x="710" y="201">END</text>

  <rect class="box" x="412" y="282" width="216" height="56" rx="8"/>
  <text class="lab m" x="520" y="306">Tools node</text>
  <text class="small m" x="520" y="326">runs the requested tools</text>

  <!-- edge labels -->
  <text class="key m" x="520" y="136">conditional edge: route(state)</text>
  <text class="key m" x="625" y="186">no</text>
  <text class="key" x="532" y="266">yes</text>
  <text class="note e" x="293" y="270">tool results</text>
  <text class="note e" x="293" y="290">join the state</text>

  <!-- save arrow between the panels -->
  <path class="save" d="M250 360V398" marker-end="url(#b)"/>
  <text class="note" x="266" y="385">after every step: save the full state</text>

  <!-- checkpointer panel -->
  <rect class="band" x="40" y="404" width="740" height="196" rx="10"/>
  <text class="lab" x="56" y="430">Checkpointer</text>
  <text class="note" x="166" y="430">saved states for thread_id "user-42", one per step</text>

  <rect class="card" x="56" y="446" width="208" height="130" rx="8"/>
  <text class="lab" x="72" y="472">After step 1</text>
  <text class="note" x="72" y="496">ran: model node</text>
  <text class="note" x="72" y="517">added: AI tool call</text>
  <text class="note" x="72" y="538">messages: 2</text>
  <text class="note" x="72" y="559">next: tools</text>

  <rect class="card" x="296" y="446" width="208" height="130" rx="8"/>
  <text class="lab" x="312" y="472">After step 2</text>
  <text class="note" x="312" y="496">ran: tools node</text>
  <text class="note" x="312" y="517">added: tool result</text>
  <text class="note" x="312" y="538">messages: 3</text>
  <text class="note" x="312" y="559">next: model</text>

  <rect class="card" x="536" y="446" width="208" height="130" rx="8"/>
  <text class="lab" x="552" y="472">After step 3</text>
  <text class="note" x="552" y="496">ran: model node</text>
  <text class="note" x="552" y="517">added: the answer</text>
  <text class="note" x="552" y="538">messages: 4</text>
  <text class="note" x="552" y="559">next: END</text>

  <path class="edge" d="M266 511H292" marker-end="url(#g)"/>
  <path class="edge" d="M506 511H532" marker-end="url(#g)"/>

  <!-- notes panel -->
  <rect x="812" y="104" width="348" height="496" rx="10" fill="#121612" stroke="#2A312A"/>
  <text class="lab" x="832" y="138">How one run goes</text>
  <text class="note" x="832" y="168">1. START passes the input to the</text>
  <text class="note" x="850" y="188">model node.</text>
  <text class="note" x="832" y="212">2. The model replies. route() reads</text>
  <text class="note" x="850" y="232">the last message.</text>
  <text class="note" x="832" y="256">3. Tool calls: run the tools node,</text>
  <text class="note" x="850" y="276">then go back to the model.</text>
  <text class="note" x="832" y="300">4. No tool calls: go to END.</text>

  <text class="lab" x="832" y="346">What the checkpointer gives you</text>
  <text class="key" x="832" y="376">Memory</text>
  <text class="note" x="850" y="396">the same thread_id continues the chat</text>
  <text class="key" x="832" y="422">Crash recovery</text>
  <text class="note" x="850" y="442">restart from the last saved step</text>
  <text class="key" x="832" y="468">Human approval</text>
  <text class="note" x="850" y="488">interrupt pauses, Command resumes</text>
  <text class="key" x="832" y="514">Replay</text>
  <text class="note" x="850" y="534">run again from an older checkpoint</text>

  <text class="lab" x="832" y="564">Storage</text>
  <text class="note" x="896" y="564">in-memory for development</text>
  <text class="note" x="896" y="584">SQLite or Postgres in production</text>
</svg>
